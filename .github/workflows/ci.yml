name: "Test"
on:
  pull_request:
    types: [opened,edited,synchronize,reopened]
  push:
    branches:
      - 'master'
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    if: github.repository_owner == 'nix-community'
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
    - run: nix build --show-trace -L
